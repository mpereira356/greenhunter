<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Montando análise | GreenHunter</title>
    <script>
      if ((localStorage.getItem('theme') || 'dark') === 'dark') document.documentElement.classList.add('theme-dark');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v='20260812-analysis-loading-theme') }}">
  </head>
  <body class="matchday-loading-only">
    <main class="matchday-loading-only-main">
      <section class="matchday-analysis-loading" aria-live="polite">
        <div class="matchday-analysis-loader-logo" aria-hidden="true">
          <span></span>
          <img src="{{ url_for('static', filename='img/greenhunter.png') }}" alt="">
        </div>
        <span class="analysis-kicker">GreenHunter Intelligence</span>
        <h1>Montando sua análise</h1>
        <p><strong>{{ match.home_team }}</strong> vs <strong>{{ match.away_team }}</strong></p>
        <div class="matchday-analysis-progress"><i></i></div>
        <small>Consultando H2H, Casa, Fora e calculando as tendências da amostra.</small>
      </section>
    </main>
    <script>
      window.setTimeout(() => window.location.replace({{ analysis_url|tojson }}), 350);
    </script>
  </body>
</html>
