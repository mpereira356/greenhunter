limit_req_zone $binary_remote_addr zone=greenhunter_general:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=greenhunter_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=greenhunter_conn:10m;

server {
    listen 80;
    server_name 191.252.193.10;
    server_tokens off;
    client_max_body_size 160m;

    location = /auth/login {
        limit_req zone=greenhunter_auth burst=5 nodelay;
        limit_conn greenhunter_conn 5;
        proxy_pass http://127.0.0.1:7777;
        include proxy_params;
    }

    location = /auth/register {
        limit_req zone=greenhunter_auth burst=3 nodelay;
        limit_conn greenhunter_conn 3;
        proxy_pass http://127.0.0.1:7777;
        include proxy_params;
    }

    location / {
        limit_req zone=greenhunter_general burst=60 nodelay;
        limit_conn greenhunter_conn 20;
        proxy_pass http://127.0.0.1:7777;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
